- insert:
    - id: mcp-tool-loading
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: streamable-http
        serverName: demo
        url: !!js process.env.DSH_MCP_DEMO_URL
        failOnStartupError: true
        reconnect:
          enabled: false

- id: tool-executor-native
  disabled: true

- id: tool-executor-ptc
  disabled: false

- id: ptc-runtime
  config:
    executionMode: per-call
